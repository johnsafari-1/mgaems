<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MGAEMS — Sponsorship Management</title><script src="/assets/app.js"></script>
<link rel="stylesheet" href="/assets/app.css"><script src="https://unpkg.com/lucide@latest"></script></head><body>
<script src="/assets/nav.js"></script><script>
const user=MGAEMS.requireAuth();renderAppShell('/sponsorship.html','/storage/school/DsN4QKTH9nHqIbLiOM7ha8HIjUHyUfOPjcKnBdgq.jpg');MGAEMS.initSidebar();
const canWrite=['system_admin','sponsor_coordinator'].includes(user.role),state={tab:'sponsors',sponsors:[],items:[],learners:[]};
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),label=v=>String(v||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase()),date=v=>v?new Date(v+'T00:00:00').toLocaleDateString():'—';
const badge=v=>`<span class="badge badge-${v==='active'?'green':v==='paused'?'amber':v==='ended'?'gray':'navy'}">${esc(label(v))}</span>`;
appMain.innerHTML=`<div class="section-header"><div><h1>Sponsorship Management</h1><div class="text-muted">Manage sponsors and learner support programmes.</div></div>${canWrite?'':'<span class="badge badge-gray">Read only</span>'}</div><div class="tabs" role="tablist"><button class="tab active" data-tab="sponsors">Sponsors</button><button class="tab" data-tab="sponsorships">Sponsorships</button></div><section id="workspace" aria-live="polite"></section>`;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function switchTab(t){state.tab=t;document.querySelectorAll('.tab').forEach(b=>{const a=b.dataset.tab===t;b.classList.toggle('active',a);b.setAttribute('aria-selected',a)});render();load()}
function render(){workspace.innerHTML=`<div class="card section sponsorship-toolbar"><div class="section-header"><div class="filter-grid sponsorship-filters"><div class="field"><label for="search">Search</label><input id="search" placeholder="Search…"></div>${state.tab==='sponsors'?`<div class="field"><label for="typeFilter">Sponsor type</label><select id="typeFilter"><option value="">All types</option>${['individual','church','ministry','ngo','foundation','general'].map(x=>`<option value="${x}">${label(x)}</option>`).join('')}</select></div>`:`<div class="field"><label for="sponsorFilter">Sponsor</label><select id="sponsorFilter"><option value="">All sponsors</option>${state.sponsors.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label for="typeFilter">Type</label><select id="typeFilter"><option value="">All types</option>${['individual','group','school_wide'].map(x=>`<option value="${x}">${label(x)}</option>`).join('')}</select></div><div class="field"><label for="statusFilter">Status</label><select id="statusFilter"><option value="">All statuses</option>${['active','paused','ended'].map(x=>`<option>${x}</option>`).join('')}</select></div>`}</div>${canWrite?`<button class="btn btn-primary" onclick="openForm()"><i data-lucide="plus"></i> New ${state.tab==='sponsors'?'Sponsor':'Sponsorship'}</button>`:''}</div></div><div class="card" style="padding:0" id="results">${MGAEMS.loadingHTML()}</div>`;['search','typeFilter','sponsorFilter','statusFilter'].forEach(id=>document.getElementById(id)?.addEventListener(id==='search'?'input':'change',delay(load)));MGAEMS.initIcons()}
function delay(fn){let t;return()=>{clearTimeout(t);t=setTimeout(fn,250)}}
async function load(){results.innerHTML=MGAEMS.loadingHTML();const q=new URLSearchParams(),s=search.value,t=typeFilter?.value;if(s)q.set('search',s);if(t)q.set(state.tab==='sponsors'?'sponsor_type':'sponsorship_type',t);if(window.sponsorFilter?.value)q.set('sponsor_id',sponsorFilter.value);if(window.statusFilter?.value)q.set('status',statusFilter.value);const r=await MGAEMS.get(`/api/v1/${state.tab}?${q}`);if(!r.ok){results.innerHTML=MGAEMS.errorHTML(r.error);return}state.tab==='sponsors'?state.sponsors=r.data:state.items=r.data;showRows(r.data)}
function showRows(a){if(!a.length){results.innerHTML=MGAEMS.emptyStateHTML(`No ${state.tab} found`,'Change the filters or create the first record.','heart-handshake');MGAEMS.initIcons();return}results.innerHTML=`<div class="table-scroll"><table><thead><tr>${state.tab==='sponsors'?'<th>Sponsor</th><th>Type</th><th>Contact</th><th>Phone</th><th>Email</th><th>Sponsorships</th>':'<th>Sponsor</th><th>Type</th><th>Learner / programme</th><th>Start</th><th>End</th><th>Status</th>'}<th>Actions</th></tr></thead><tbody>${a.map(state.tab==='sponsors'?sponsorRow:itemRow).join('')}</tbody></table></div>`;MGAEMS.initIcons()}
function sponsorRow(s){return `<tr><td><strong>${esc(s.name)}</strong></td><td>${badge(s.sponsor_type)}</td><td>${esc(s.contact_person||'—')}</td><td>${esc(s.phone||'—')}</td><td>${esc(s.email||'—')}</td><td>${s.sponsorships_count}</td><td class="actions"><button class="btn btn-secondary btn-sm" onclick="viewSponsor(${s.id})"><i data-lucide="eye"></i> View</button>${canWrite?`<button class="btn btn-secondary btn-sm" onclick="sponsorForm(${s.id})"><i data-lucide="pencil"></i> Edit</button>`:''}</td></tr>`}
function target(i){if(i.sponsorship_type==='individual')return i.student?`${esc(i.student.first_name)} ${esc(i.student.last_name)} (${esc(i.student.admission_no)})`:'—';if(i.sponsorship_type==='group')return `${i.students.length} learner${i.students.length===1?'':'s'}`;return esc(i.program_name)}
function itemRow(i){return `<tr><td><strong>${esc(i.sponsor?.name)}</strong></td><td>${badge(i.sponsorship_type)}</td><td>${target(i)}</td><td>${date(i.start_date)}</td><td>${date(i.end_date)}</td><td>${badge(i.status)}</td><td class="actions"><button class="btn btn-secondary btn-sm" onclick="viewItem(${i.id})"><i data-lucide="eye"></i> View</button>${canWrite&&i.status!=='ended'?`<button class="btn btn-secondary btn-sm" onclick="statusChange(${i.id},'${i.status==='active'?'paused':'active'}')">${i.status==='active'?'Pause':'Resume'}</button><button class="btn btn-danger btn-sm" onclick="endForm(${i.id})">End</button>`:''}</td></tr>`}
function modal(title,body,footer=''){closeModal();const o=document.createElement('div');o.className='modal-overlay';o.innerHTML=`<div class="modal modal-lg" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-header"><h2 id="modalTitle">${esc(title)}</h2><button class="modal-close" aria-label="Close" onclick="closeModal()"><i data-lucide="x"></i></button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-footer">${footer}</div>`:''}</div>`;document.body.append(o);o.onkeydown=e=>e.key==='Escape'&&closeModal();MGAEMS.initIcons();o.querySelector('input,select,button')?.focus()}
function closeModal(){document.querySelector('.modal-overlay')?.remove()}function openForm(){state.tab==='sponsors'?sponsorForm():sponsorshipForm()}
const field=(id,title,type='input',v='',req=false)=>`<div class="field"><label for="${id}">${title}${req?' *':''}</label>${type==='textarea'?`<textarea id="${id}" rows="3">${esc(v)}</textarea>`:`<input id="${id}" value="${esc(v)}" ${req?'required':''}>`}<div class="field-error" data-error="${id}"></div></div>`;
function sponsorForm(id){const s=state.sponsors.find(x=>x.id===id)||{};modal(id?'Edit Sponsor':'New Sponsor',`<div id="formAlert"></div><div class="form-grid"><div class="field"><label for="sponsorType">Sponsor Type *</label><select id="sponsorType">${['individual','church','ministry','ngo','foundation','general'].map(x=>`<option value="${x}" ${s.sponsor_type===x?'selected':''}>${label(x)}</option>`).join('')}</select></div>${field('sponsorName','Name','input',s.name,true)}${field('contactPerson','Contact Person','input',s.contact_person)}${field('phone','Phone','input',s.phone)}${field('email','Email','input',s.email)}${field('address','Address','textarea',s.address)}${field('notes','Notes','textarea',s.notes)}</div>`,footer('Save Sponsor',`saveSponsor(${id||'null'})`))}
async function saveSponsor(id){const b={sponsor_type:sponsorType.value,name:sponsorName.value.trim(),contact_person:contactPerson.value.trim()||null,phone:phone.value.trim()||null,email:email.value.trim()||null,address:address.value.trim()||null,notes:notes.value.trim()||null};submit(id?MGAEMS.patch(`/api/v1/sponsors/${id}`,b):MGAEMS.post('/api/v1/sponsors',b),'Sponsor saved.')}
async function viewSponsor(id){const r=await MGAEMS.get(`/api/v1/sponsors/${id}`);if(!r.ok)return MGAEMS.toast(r.error,'error');const s=r.data;modal(s.name,details([['Type',badge(s.sponsor_type)],['Contact',esc(s.contact_person||'—')],['Phone',esc(s.phone||'—')],['Email',esc(s.email||'—')],['Address',esc(s.address||'—')],['Sponsorships',s.sponsorships_count]])+(s.notes?`<h3>Notes</h3><p>${esc(s.notes)}</p>`:''))}
async function sponsorshipForm(){if(!state.sponsors.length){const r=await MGAEMS.get('/api/v1/sponsors');if(r.ok)state.sponsors=r.data}if(!state.learners.length){const r=await MGAEMS.get('/api/v1/sponsorships/learners');if(r.ok)state.learners=r.data}modal('New Sponsorship',`<div id="formAlert"></div><div class="form-grid"><div class="field"><label for="sponsorId">Sponsor *</label><select id="sponsorId"><option value="">Select…</option>${state.sponsors.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><div class="field-error" data-error="sponsor_id"></div></div><div class="field"><label for="spType">Type *</label><select id="spType" onchange="targetField()">${['individual','group','school_wide'].map(x=>`<option value="${x}">${label(x)}</option>`).join('')}</select></div>${field('startDate','Start Date','input','',true)}${field('plannedEnd','Planned End Date')}<div id="targetBox" class="full-span"></div>${field('spNotes','Notes','textarea')}</div>`,footer('Create Sponsorship','saveSponsorship()'));startDate.type=plannedEnd.type='date';targetField()}
const learner=s=>`${esc(s.first_name)} ${esc(s.last_name)} — ${esc(s.admission_no)}${s.school_class?' · '+esc(s.school_class.name):''}`;
function targetField(){targetBox.innerHTML=spType.value==='school_wide'?field('programName','Programme Name','input','',true):spType.value==='individual'?`<div class="field"><label for="studentId">Learner *</label><select id="studentId"><option value="">Select…</option>${state.learners.map(s=>`<option value="${s.id}" ${s.has_active_individual_sponsorship?'disabled':''}>${learner(s)}${s.has_active_individual_sponsorship?' — already actively sponsored':''}</option>`).join('')}</select><div class="field-error" data-error="student_id"></div></div>`:`<fieldset class="learner-picker"><legend>Active Learners *</legend>${state.learners.map(s=>`<label><input type="checkbox" name="member" value="${s.id}"> ${learner(s)}</label>`).join('')}<div class="field-error" data-error="student_ids"></div></fieldset>`}
async function saveSponsorship(){const type=spType.value,b={sponsor_id:Number(sponsorId.value)||null,sponsorship_type:type,start_date:startDate.value,end_date:plannedEnd.value||null,notes:spNotes.value.trim()||null};if(type==='individual')b.student_id=Number(studentId.value)||null;if(type==='group')b.student_ids=[...document.querySelectorAll('[name=member]:checked')].map(x=>Number(x.value));if(type==='school_wide')b.program_name=programName.value.trim();submit(MGAEMS.post('/api/v1/sponsorships',b),'Sponsorship created.')}
const details=a=>`<dl class="detail-grid">${a.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
async function viewItem(id){const r=await MGAEMS.get(`/api/v1/sponsorships/${id}`);if(!r.ok)return MGAEMS.toast(r.error,'error');const i=r.data;modal(`${label(i.sponsorship_type)} Sponsorship`,details([['Sponsor',esc(i.sponsor.name)],['Status',badge(i.status)],['Target',target(i)],['Dates',`${date(i.start_date)} – ${date(i.end_date)}`],['Created by',esc(i.created_by?.username||'—')]])+(i.students?.length?`<h3>Group Members</h3><ul>${i.students.map(s=>`<li>${learner(s)}</li>`).join('')}</ul>`:'')+(i.notes?`<h3>Notes</h3><p>${esc(i.notes)}</p>`:''))}
async function statusChange(id,status){const i=state.items.find(x=>x.id===id),r=await MGAEMS.patch(`/api/v1/sponsorships/${id}`,{status,end_date:i.end_date,notes:i.notes});if(!r.ok)return MGAEMS.toast(r.error,'error');MGAEMS.toast(status==='paused'?'Sponsorship paused.':'Sponsorship resumed.','success');load()}
function endForm(id){modal('End Sponsorship',`<div class="alert alert-error"><i data-lucide="alert-triangle"></i><span>Ending is permanent and cannot be reversed.</span></div><div id="formAlert"></div>${field('endDate','End Date','input',new Date().toISOString().slice(0,10),true)}${field('reason','Reason','textarea','',true)}`,footer('End Sponsorship',`endItem(${id})`,'btn-danger'));endDate.type='date'}
function footer(text,action,cls='btn-primary'){return `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button id="saveBtn" class="btn ${cls}" onclick="${action}">${text}</button>`}function endItem(id){submit(MGAEMS.patch(`/api/v1/sponsorships/${id}`,{status:'ended',end_date:endDate.value,notes:reason.value.trim()}),'Sponsorship ended.')}
async function submit(p,msg){saveBtn.disabled=true;saveBtn.textContent='Saving…';document.querySelectorAll('.field-error').forEach(e=>e.textContent='');const r=await p;if(!r.ok){saveBtn.disabled=false;saveBtn.textContent='Try Again';if(r.fields)Object.entries(r.fields).forEach(([k,v])=>{const e=document.querySelector(`[data-error="${k}"]`);if(e)e.textContent=v[0]});formAlert.innerHTML=MGAEMS.errorHTML(r.error);MGAEMS.initIcons();return}closeModal();MGAEMS.toast(msg,'success');load()}
render();load();MGAEMS.initIcons();
</script></body></html>
