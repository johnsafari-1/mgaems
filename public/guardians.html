<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGAEMS — Parents / Guardians</title>
<link rel="stylesheet" href="/assets/app.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  .guardian-learners { display: flex; flex-wrap: wrap; gap: 6px; min-width: 220px; }
  .guardian-learner { display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px; border: 1px solid var(--gray-200); border-radius: 6px; background: var(--gray-50); }
  .guardian-learner button, .icon-button { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border: 1px solid var(--gray-300); border-radius: 6px; background: white; color: var(--gray-700); cursor: pointer; }
  .guardian-learner button { width: 22px; height: 22px; border: 0; color: var(--red); }
  .guardian-learner svg, .icon-button svg { width: 14px; height: 14px; }
  .guardian-actions { display: flex; gap: 6px; white-space: nowrap; }
  .guardian-contact { min-width: 180px; }
  .guardian-contact small { display: block; color: var(--gray-500); }
  .guardian-table { min-width: 760px; }
  .guardian-account { white-space: nowrap; }
  .guardian-student-list { max-height: 250px; overflow: auto; border: 1px solid var(--gray-300); border-radius: var(--radius); }
  .guardian-student-option { display: flex; align-items: flex-start; gap: 9px; padding: 9px 12px; border-bottom: 1px solid var(--gray-200); cursor: pointer; }
  .guardian-student-option:last-child { border-bottom: 0; }
  .guardian-student-option input { margin-top: 3px; }
  .guardian-student-option small { display: block; color: var(--gray-500); }
  .guardian-account-fields[hidden], .guardian-student-picker[hidden] { display: none; }
  .guardian-primary { margin: 0 0 var(--space-4); }
  @media (max-width: 700px) { .guardian-table-wrap { overflow-x: auto; } }
</style>
</head>
<body>
<script src="/assets/app.js"></script>
<script src="/assets/nav.js"></script>
<script>
const user = MGAEMS.requireAuth();
const MANAGER_ROLES = ['system_admin', 'head_teacher', 'deputy_head_teacher'];
if (user && !MANAGER_ROLES.includes(user.role)) window.location.href = '/dashboard.html';
if (user && MANAGER_ROLES.includes(user.role)) {
  renderAppShell('/guardians.html', '/storage/school/DsN4QKTH9nHqIbLiOM7ha8HIjUHyUfOPjcKnBdgq.jpg');
  MGAEMS.initSidebar();

  const main = document.getElementById('appMain');
  const state = { search: '', timer: null, modal: null, selectedStudents: new Map(), excludedStudents: new Set(), learnerPage: 1, learnerTotalPages: 1, learnerSearch: '' };
  const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));

  main.innerHTML = `
    <div class="section-header">
      <h1>Parents / Guardians</h1>
      <button class="btn btn-primary" id="addGuardianBtn"><i data-lucide="user-round-plus"></i> Add Guardian</button>
    </div>
    <div class="card" style="padding:var(--space-4)">
      <div class="toolbar">
        <div class="search-input">
          <i data-lucide="search"></i>
          <input type="search" id="guardianSearch" placeholder="Search guardians, contacts, learners or admission no..." aria-label="Search guardians">
        </div>
      </div>
      <div id="guardiansTable">${MGAEMS.loadingHTML('Loading parents and guardians…')}</div>
    </div>`;
  MGAEMS.initIcons();
  document.getElementById('addGuardianBtn').addEventListener('click', () => openGuardianModal());
  document.getElementById('guardianSearch').addEventListener('input', event => {
    clearTimeout(state.timer);
    state.timer = setTimeout(() => { state.search = event.target.value.trim(); loadGuardians(); }, 300);
  });

  async function loadGuardians() {
    const wrap = document.getElementById('guardiansTable');
    wrap.innerHTML = MGAEMS.loadingHTML('Loading parents and guardians…');
    const params = new URLSearchParams();
    if (state.search) params.set('search', state.search);
    const result = await MGAEMS.get('/api/v1/guardians?' + params.toString());
    if (!result.ok) { wrap.innerHTML = MGAEMS.errorHTML(result.error); MGAEMS.initIcons(); return; }
    if (!result.data.length) {
      wrap.innerHTML = MGAEMS.emptyStateHTML(state.search ? 'No guardians match your search' : 'No guardians recorded', state.search ? 'Try another name, contact, learner or admission number.' : 'Add a guardian and link them to one or more learners.', 'contact-round');
      MGAEMS.initIcons();
      return;
    }

    const accessBadge = status => status === 'active' ? 'badge-green' : status === 'locked' || status === 'role_mismatch' ? 'badge-red' : status === 'inactive' ? 'badge-amber' : 'badge-gray';
    const accessLabel = status => status === 'no_account' ? 'No account' : status === 'role_mismatch' ? 'Role mismatch' : status;
    wrap.innerHTML = `<div class="guardian-table-wrap"><table class="guardian-table">
      <thead><tr><th>Guardian</th><th>Linked learner(s)</th><th>Portal access</th><th>Actions</th></tr></thead>
      <tbody>${result.data.map(guardian => `
        <tr>
          <td class="guardian-contact"><strong>${esc(guardian.full_name)}</strong><small>${esc(guardian.relationship)}</small><small>${esc(guardian.phone)}${guardian.email ? ` · ${esc(guardian.email)}` : ''}</small></td>
          <td><div class="guardian-learners">${guardian.students.map(student => `<span class="guardian-learner"><span>${esc(student.name)}<small class="text-muted">${esc(student.admission_no)} · ${esc(student.class || 'No class')}</small></span><button type="button" title="Unlink ${esc(student.name)}" aria-label="Unlink ${esc(student.name)}" data-unlink="${guardian.id}" data-student="${student.id}"><i data-lucide="unlink"></i></button></span>`).join('')}</div></td>
          <td class="guardian-account"><span class="badge ${accessBadge(guardian.access_status)}">${esc(accessLabel(guardian.access_status))}</span>${guardian.account ? `<small class="text-muted">${esc(guardian.account.username)}</small>` : ''}</td>
          <td><div class="guardian-actions">
            <button class="icon-button" type="button" title="Edit guardian" aria-label="Edit ${esc(guardian.full_name)}" data-edit="${guardian.id}"><i data-lucide="pencil"></i></button>
            <button class="icon-button" type="button" title="Link learner" aria-label="Link learner to ${esc(guardian.full_name)}" data-link="${guardian.id}"><i data-lucide="user-round-plus"></i></button>
          </div></td>
        </tr>`).join('')}</tbody>
    </table></div>`;
    wrap.querySelectorAll('[data-edit]').forEach(button => button.addEventListener('click', () => openGuardianModal(result.data.find(item => item.id === Number(button.dataset.edit)))));
    wrap.querySelectorAll('[data-link]').forEach(button => button.addEventListener('click', () => openLinkModal(result.data.find(item => item.id === Number(button.dataset.link)))));
    wrap.querySelectorAll('[data-unlink]').forEach(button => button.addEventListener('click', () => unlinkStudent(button.dataset.unlink, button.dataset.student, button)));
    MGAEMS.initIcons();
  }

  async function openGuardianModal(guardian = null) {
    state.selectedStudents = new Map((guardian?.students || []).map(student => [String(student.id), student]));
    state.excludedStudents = new Set();
    state.learnerPage = 1;
    state.learnerSearch = '';
    const accountsResult = await MGAEMS.get('/api/v1/guardians/accounts');
    if (!accountsResult.ok) { MGAEMS.toast(accountsResult.error, 'error'); return; }
    const accounts = accountsResult.data;
    const initialMode = guardian?.account ? 'existing' : 'none';
    showModal(guardian ? 'Edit Guardian' : 'Add Guardian', `
      <div id="guardianFormError"></div>
      <div class="form-grid">
        <div class="field"><label for="guardianName">Full name *</label><input id="guardianName" maxlength="150" required value="${esc(guardian?.full_name || '')}"></div>
        <div class="field"><label for="guardianRelationship">Relationship *</label><input id="guardianRelationship" maxlength="30" required value="${esc(guardian?.relationship || '')}" placeholder="e.g. Mother"></div>
        <div class="field"><label for="guardianPhone">Phone *</label><input id="guardianPhone" maxlength="20" required value="${esc(guardian?.phone || '')}"></div>
        <div class="field"><label for="guardianEmail">Email</label><input id="guardianEmail" type="email" maxlength="150" value="${esc(guardian?.email || '')}"></div>
        <div class="field full"><label for="guardianAddress">Address</label><input id="guardianAddress" maxlength="255" value="${esc(guardian?.address || '')}"></div>
      </div>
      <label class="guardian-primary flex gap-2"><input type="checkbox" id="guardianPrimary" style="width:auto" ${guardian?.is_primary_contact ? 'checked' : ''}> Primary contact for linked learner(s)</label>
      <div class="field"><label for="accountMode">Parent portal account</label>
        <select id="accountMode">
          <option value="none" ${initialMode === 'none' ? 'selected' : ''}>No portal account</option>
          <option value="existing" ${initialMode === 'existing' ? 'selected' : ''}>Associate existing account</option>
          <option value="create">Create parent account</option>
        </select>
      </div>
      <div class="field" id="existingAccountFields" ${initialMode === 'existing' ? '' : 'hidden'}>
        <label for="guardianAccount">Parent account</label>
        <select id="guardianAccount"><option value="">Select account…</option>${accounts.map(account => `<option value="${account.id}" ${account.linked && guardian?.account?.id !== account.id ? 'disabled' : ''} ${guardian?.account?.id === account.id ? 'selected' : ''}>${esc(account.username)} · ${esc(account.email)} · ${esc(account.status)}${account.linked && guardian?.account?.id !== account.id ? ' · already linked' : ''}</option>`).join('')}</select>
      </div>
      <div class="guardian-account-fields" id="newAccountFields" hidden>
        <div class="form-grid">
          <div class="field"><label for="accountUsername">Username *</label><input id="accountUsername" maxlength="100" autocomplete="off"></div>
          <div class="field"><label for="accountEmail">Login email *</label><input id="accountEmail" type="email" maxlength="150" autocomplete="off"></div>
          <div class="field full"><label for="accountPassword">Temporary password *</label><input id="accountPassword" type="password" minlength="10" autocomplete="new-password"><small class="text-muted">Minimum 10 characters. Passwords are never displayed after creation.</small></div>
        </div>
      </div>
      <div class="guardian-student-picker" id="studentPicker" ${guardian ? 'hidden' : ''}>
        <div class="field"><label for="studentSearch">Link learner(s) *</label><input type="search" id="studentSearch" placeholder="Search name or admission number"></div>
        <div class="guardian-student-list" id="studentChoices">${MGAEMS.loadingHTML('Loading learners…')}</div>
        <div class="pagination" id="studentPagination" style="display:none"></div>
      </div>
    `, guardian ? 'Save Changes' : 'Create Guardian', async button => {
      const payload = {
        full_name: document.getElementById('guardianName').value.trim(),
        relationship: document.getElementById('guardianRelationship').value.trim(),
        phone: document.getElementById('guardianPhone').value.trim(),
        email: document.getElementById('guardianEmail').value.trim() || null,
        address: document.getElementById('guardianAddress').value.trim() || null,
        is_primary_contact: document.getElementById('guardianPrimary').checked,
      };
      const mode = document.getElementById('accountMode').value;
      if (mode === 'existing') payload.user_id = document.getElementById('guardianAccount').value || null;
      if (mode === 'create') {
        payload.account = {
          username: document.getElementById('accountUsername').value.trim(),
          email: document.getElementById('accountEmail').value.trim(),
          password: document.getElementById('accountPassword').value,
        };
      }
      if (!guardian) payload.student_ids = [...state.selectedStudents.keys()].map(Number);
      if (!payload.full_name || !payload.relationship || !payload.phone || (!guardian && !payload.student_ids.length)) {
        setModalError('Complete all required fields and select at least one learner.');
        return;
      }

      button.disabled = true;
      button.innerHTML = `<span class="spinner" style="width:15px;height:15px;margin:0"></span> Saving…`;
      const result = guardian
        ? await MGAEMS.patch(`/api/v1/guardians/${guardian.id}`, payload)
        : await MGAEMS.post('/api/v1/guardians', payload);
      if (!result.ok) { setModalError(result.error); button.disabled = false; button.textContent = guardian ? 'Save Changes' : 'Create Guardian'; return; }
      closeModal();
      MGAEMS.toast(guardian ? 'Guardian details updated.' : 'Guardian created.', 'success');
      loadGuardians();
    });
    const modeSelect = document.getElementById('accountMode');
    modeSelect.addEventListener('change', syncAccountFields);
    syncAccountFields();
    if (!guardian) {
      document.getElementById('studentSearch').addEventListener('input', debounceStudents);
      loadStudentChoices('');
    }
  }

  async function openLinkModal(guardian) {
    state.selectedStudents = new Map();
    state.excludedStudents = new Set(guardian.students.map(student => String(student.id)));
    state.learnerPage = 1;
    state.learnerSearch = '';
    showModal(`Link learner to ${guardian.full_name}`, `
      <div id="guardianFormError"></div>
      <div class="field"><label for="studentSearch">Search learners</label><input type="search" id="studentSearch" placeholder="Name or admission number"></div>
      <div class="guardian-student-list" id="studentChoices">${MGAEMS.loadingHTML('Loading learners…')}</div>
      <div class="pagination" id="studentPagination" style="display:none"></div>
    `, 'Link Learners', async button => {
      const student_ids = [...state.selectedStudents.keys()].map(Number);
      if (!student_ids.length) { setModalError('Select at least one learner to link.'); return; }
      button.disabled = true;
      button.textContent = 'Linking…';
      const result = await MGAEMS.post(`/api/v1/guardians/${guardian.id}/students`, { student_ids });
      if (!result.ok) { setModalError(result.error); button.disabled = false; button.textContent = 'Link Learners'; return; }
      closeModal();
      MGAEMS.toast('Learner link added.', 'success');
      loadGuardians();
    });
    document.getElementById('studentSearch').addEventListener('input', debounceStudents);
    loadStudentChoices('');
  }

  function showModal(title, body, submitLabel, onSubmit) {
    closeModal();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `<div class="modal modal-lg" role="dialog" aria-modal="true" aria-labelledby="guardianModalTitle">
      <div class="modal-header"><h2 id="guardianModalTitle">${esc(title)}</h2><button class="modal-close" type="button" aria-label="Close dialog"><i data-lucide="x"></i></button></div>
      <div class="modal-body">${body}</div>
      <div class="modal-footer"><button class="btn btn-secondary" type="button" data-cancel>Cancel</button><button class="btn btn-primary" type="button" data-submit>${esc(submitLabel)}</button></div>
    </div>`;
    document.body.appendChild(overlay);
    state.modal = overlay;
    overlay.querySelector('.modal-close').addEventListener('click', closeModal);
    overlay.querySelector('[data-cancel]').addEventListener('click', closeModal);
    overlay.querySelector('[data-submit]').addEventListener('click', event => onSubmit(event.currentTarget));
    overlay.addEventListener('click', event => { if (event.target === overlay) closeModal(); });
    MGAEMS.initIcons();
  }

  function closeModal() {
    state.modal?.remove();
    state.modal = null;
  }

  function setModalError(message) {
    const target = document.getElementById('guardianFormError');
    if (target) { target.innerHTML = MGAEMS.errorHTML(message); MGAEMS.initIcons(); }
  }

  function syncAccountFields() {
    const mode = document.getElementById('accountMode').value;
    document.getElementById('existingAccountFields').hidden = mode !== 'existing';
    document.getElementById('newAccountFields').hidden = mode !== 'create';
  }

  function debounceStudents(event) {
    clearTimeout(state.timer);
    state.timer = setTimeout(() => loadStudentChoices(event.target.value.trim()), 250);
  }

  async function loadStudentChoices(search) {
    const choices = document.getElementById('studentChoices');
    if (!choices) return;
    state.learnerSearch = search;
    choices.innerHTML = MGAEMS.loadingHTML('Loading learners…');
    const params = new URLSearchParams({ per_page: '100', page: String(state.learnerPage) });
    if (search) params.set('search', search);
    const result = await MGAEMS.get('/api/v1/students?' + params.toString());
    if (!result.ok) { choices.innerHTML = MGAEMS.errorHTML(result.error); MGAEMS.initIcons(); return; }
    state.learnerTotalPages = Math.max(1, Math.ceil((result.meta?.total || 0) / (result.meta?.per_page || 100)));
    const students = result.data.filter(student => !state.excludedStudents.has(String(student.id)));
    if (!students.length) {
      choices.innerHTML = '<div class="empty-state" style="padding:var(--space-4)"><div class="title">No available learners found</div></div>';
    } else {
      choices.innerHTML = students.map(student => `<label class="guardian-student-option">
        <input type="checkbox" data-student-choice="${student.id}" ${state.selectedStudents.has(String(student.id)) ? 'checked' : ''}>
        <span>${esc(student.first_name)} ${esc(student.last_name)}<small>${esc(student.admission_no)} · ${esc(student.school_class?.name || 'No class')} · ${esc(student.status)}</small></span>
      </label>`).join('');
      choices.querySelectorAll('[data-student-choice]').forEach(input => input.addEventListener('change', () => {
        const id = input.dataset.studentChoice;
        const student = students.find(item => String(item.id) === id);
        if (input.checked) state.selectedStudents.set(id, student);
        else state.selectedStudents.delete(id);
      }));
    }
    const pagination = document.getElementById('studentPagination');
    pagination.style.display = state.learnerTotalPages > 1 ? 'flex' : 'none';
    pagination.innerHTML = `<span>Page ${state.learnerPage} of ${state.learnerTotalPages}</span><div class="flex gap-2">
      <button class="btn btn-secondary btn-sm" data-page="-1" ${state.learnerPage <= 1 ? 'disabled' : ''}><i data-lucide="chevron-left"></i> Prev</button>
      <button class="btn btn-secondary btn-sm" data-page="1" ${state.learnerPage >= state.learnerTotalPages ? 'disabled' : ''}>Next <i data-lucide="chevron-right"></i></button>
    </div>`;
    pagination.querySelectorAll('[data-page]').forEach(button => button.addEventListener('click', () => {
      state.learnerPage += Number(button.dataset.page);
      loadStudentChoices(state.learnerSearch);
    }));
    MGAEMS.initIcons();
  }

  async function unlinkStudent(guardianId, studentId, button) {
    if (!window.confirm('Unlink this learner from the guardian? Their other learner links and account will remain unchanged.')) return;
    button.disabled = true;
    button.innerHTML = '<span class="spinner" style="width:14px;height:14px;margin:0"></span>';
    const result = await MGAEMS.del(`/api/v1/guardians/${guardianId}/students/${studentId}`);
    if (!result.ok) { MGAEMS.toast(result.error, 'error'); button.disabled = false; button.innerHTML = '<i data-lucide="unlink"></i>'; MGAEMS.initIcons(); return; }
    MGAEMS.toast('Learner unlinked.', 'success');
    loadGuardians();
  }

  loadGuardians();
}
</script>
</body>
</html>
