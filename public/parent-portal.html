<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parent Portal — MGAEMS</title><script src="/assets/app.js"></script>
<link rel="stylesheet" href="/assets/app.css"><script src="https://unpkg.com/lucide@latest"></script><style>.portal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}.metric{font-size:1.6rem;font-weight:700}.selector{display:flex;gap:.75rem;flex-wrap:wrap;margin:1rem 0}.selector button.active{background:var(--primary-bg);color:var(--on-primary)}.section{margin-top:1.25rem}.portal-list{display:grid;gap:.65rem}.portal-row{padding:.8rem;border:1px solid var(--gray-200);border-radius:8px;display:flex;justify-content:space-between;gap:1rem;align-items:center}</style></head><body>
<script src="/assets/nav.js"></script><script>
const user=MGAEMS.requireAuth(); if(user&&user.role!=='parent_guardian') location.href='/dashboard.html'; renderAppShell('/parent-portal.html');
const main=document.getElementById('appMain'); let selected;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){main.innerHTML='<h2>Parent Portal</h2>'+MGAEMS.loadingHTML('Loading linked learners…');const r=await MGAEMS.get('/api/v1/portal/parent/children');if(!r.ok)return fail(r);if(!r.data.length){main.innerHTML='<h2>Parent Portal</h2>'+MGAEMS.emptyStateHTML('No linked learners','Contact the school if a learner should be linked to your account.','users');return}selected=r.data[0];main.innerHTML=`<h2>Parent Portal</h2><p>Attendance, assessment progress, and report cards for your linked learners.</p><div class="selector">${r.data.map(c=>`<button class="btn btn-secondary child" data-id="${c.id}">${esc(c.first_name)} ${esc(c.last_name)}</button>`).join('')}</div><div id="learner"></div>`;document.querySelectorAll('.child').forEach(b=>b.onclick=()=>{selected=r.data.find(c=>c.id==b.dataset.id);load()});load()}
async function load(){document.querySelectorAll('.child').forEach(b=>b.classList.toggle('active',b.dataset.id==selected.id));const el=document.getElementById('learner');el.innerHTML=MGAEMS.loadingHTML('Loading learner records…');const base=`/api/v1/portal/parent/children/${selected.id}`;const [a,p,c]=await Promise.all([MGAEMS.get(base+'/attendance'),MGAEMS.get(base+'/progress'),MGAEMS.get(base+'/report-cards')]);if(!a.ok||!p.ok||!c.ok)return fail(!a.ok?a:!p.ok?p:c,el);const s=a.data.summary;el.innerHTML=`<div class="card"><h3>${esc(selected.first_name)} ${esc(selected.last_name)}</h3><p>${esc(selected.admission_no)} · ${esc(selected.class?.name||'Class not assigned')} · ${esc(selected.status)}</p></div><section class="section"><h3>Attendance</h3>${s.total?`<div class="portal-grid">${[['Present',s.present],['Absent',s.absent],['Late',s.late],['Excused',s.excused],['Attendance',s.attendance_percentage+'%']].map(x=>`<div class="card"><div class="metric">${x[1]}</div><div>${x[0]}</div></div>`).join('')}</div>`:MGAEMS.emptyStateHTML('No attendance records')}</section><section class="section"><h3>Assessment progress</h3>${p.data.length?`<div class="portal-list">${p.data.map(x=>`<div class="portal-row"><div><strong>${esc(x.subject)}</strong> · ${esc(x.term)}<br><small>${esc(x.assessment_type)} · ${esc(x.competency_rating||'No rating')} · ${esc(x.recorded_date||'')}</small><br>${esc(x.remarks||'')}</div><strong>${esc(x.score??'—')}</strong></div>`).join('')}</div>`:MGAEMS.emptyStateHTML('No assessments yet')}</section><section class="section"><h3>Report cards</h3>${c.data.length?`<div class="portal-list">${c.data.map(x=>`<div class="portal-row"><div><strong>${esc(x.term?.name||'Report card')}</strong><br><small>${esc(x.generated_date||'')}</small><br>${esc(x.overall_remark||'')}</div>${x.download_available?`<button class="btn btn-primary" onclick="getCard(${x.id},this)">Download</button>`:''}</div>`).join('')}</div>`:MGAEMS.emptyStateHTML('No report cards yet')}</section>`;MGAEMS.initIcons()}
async function getCard(id,b){const old=b.textContent;b.disabled=true;b.textContent='Downloading…';const r=await MGAEMS.download(`/api/v1/portal/parent/children/${selected.id}/report-cards/${id}/download`,`report-card-${selected.admission_no}.pdf`);b.disabled=false;b.textContent=old;if(!r.ok)MGAEMS.toast(r.status===403?'You are not permitted to download this report card.':r.error,'error')}
function fail(r,target=main){target.innerHTML=MGAEMS.errorHTML(r.status===403?'You do not have permission to view this learner.':r.error);MGAEMS.initIcons()}MGAEMS.initSidebar();MGAEMS.initIcons();init();
</script></body></html>
