<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGAEMS — Assessment &amp; Report Cards</title>
<link rel="stylesheet" href="/assets/app.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<script src="/assets/app.js"></script>
<script src="/assets/nav.js"></script>
<script>
const user = MGAEMS.requireAuth();
renderAppShell('/assessment.html', '/storage/school/DsN4QKTH9nHqIbLiOM7ha8HIjUHyUfOPjcKnBdgq.jpg');
MGAEMS.initSidebar();

const ADMIN_ROLES = ['system_admin', 'head_teacher', 'deputy_head_teacher'];
const canGenerateReports = ADMIN_ROLES.includes(user.role);
const state = { context: null, learners: [], dirty: new Set(), saving: new Set(), selection: {}, reportCard: null, reportLearners: [] };
const ratingLabels = ['Exceeding Expectation', 'Meeting Expectation', 'Approaching Expectation', 'Below Expectation'];
const escapeHTML = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const selected = (a, b) => String(a ?? '') === String(b ?? '') ? ' selected' : '';
const option = (value, label, current) => `<option value="${escapeHTML(value)}"${selected(value, current)}>${escapeHTML(label)}</option>`;

document.getElementById('appMain').innerHTML = `
  <div class="section-header"><div><h1>Assessment &amp; Report Cards</h1><div class="text-muted">Record CBC results and prepare term report cards.</div></div></div>
  <div class="tabs" id="assessmentTabs" role="tablist" aria-label="Assessment module">
    <button class="tab active" id="entryTab" role="tab" aria-selected="true" aria-controls="entryPanel" data-tab="entry">Assessment Entry</button>
    <button class="tab" id="reportsTab" role="tab" aria-selected="false" aria-controls="reportsPanel" data-tab="reports">Report Cards</button>
  </div>
  <section class="tab-panel active" id="entryPanel" role="tabpanel" aria-labelledby="entryTab">
    <div class="card section">
      <div class="section-header"><div><h2>Assessment Context</h2><div class="text-muted">Choose an authorized class, subject and term.</div></div></div>
      <div id="contextArea">${MGAEMS.loadingHTML('Loading assessment context…')}</div>
    </div>
    <div class="card" style="padding:0"><div id="rosterArea">${MGAEMS.emptyStateHTML('Select an assessment context', 'Complete the filters above to load active learners.', 'clipboard-check')}</div></div>
  </section>
  <section class="tab-panel" id="reportsPanel" role="tabpanel" aria-labelledby="reportsTab" hidden>
    <div id="reportArea"></div>
  </section>`;
MGAEMS.initIcons();

document.querySelectorAll('#assessmentTabs .tab').forEach(tab => tab.addEventListener('click', () => switchTab(tab.dataset.tab)));
function switchTab(name) {
  document.querySelectorAll('#assessmentTabs .tab').forEach(tab => {
    const active = tab.dataset.tab === name;
    tab.classList.toggle('active', active); tab.setAttribute('aria-selected', active);
  });
  ['entry', 'reports'].forEach(panel => {
    const el = document.getElementById(panel + 'Panel');
    const active = panel === name; el.classList.toggle('active', active); el.hidden = !active;
  });
}

function assignmentParts(a) {
  return { classItem: a.school_class || a.schoolClass, subject: a.subject, term: a.term };
}
function unique(items) { return [...new Map(items.filter(Boolean).map(item => [item.id, item])).values()]; }
function termsForYear(terms, yearId) { return terms.filter(t => !yearId || String(t.academic_year_id) === String(yearId)); }
function academicYears(terms) { return unique(terms.map(t => t.academic_year).filter(Boolean)); }

async function loadContext() {
  const res = await MGAEMS.get('/api/v1/assessments/context');
  if (!res.ok) {
    document.getElementById('contextArea').innerHTML = res.status === 403
      ? MGAEMS.emptyStateHTML('Assessment access unavailable', res.error, 'shield-alert') : MGAEMS.errorHTML(res.error);
    MGAEMS.initIcons(); return;
  }
  state.context = res.data;
  if (res.data.scope === 'assigned' && !res.data.assignments.length) {
    document.getElementById('contextArea').innerHTML = MGAEMS.emptyStateHTML('No authorized assignments', 'No class, subject and term assignments are available for your account.', 'book-x');
    MGAEMS.initIcons(); return;
  }
  const allTerms = res.data.scope === 'school' ? res.data.terms : unique(res.data.assignments.map(a => assignmentParts(a).term));
  const years = academicYears(allTerms);
  const currentTerm = allTerms.find(t => t.is_current) || allTerms[0];
  state.selection = { year: currentTerm?.academic_year_id || years[0]?.id || '', term: currentTerm?.id || '', class: '', subject: '', type: 'continuous' };
  renderContext();
}

function availableContext() {
  const c = state.context;
  if (c.scope === 'school') return { classes: c.classes, subjects: c.subjects, terms: c.terms };
  let assignments = c.assignments;
  if (state.selection.year) assignments = assignments.filter(a => String(assignmentParts(a).term?.academic_year_id) === String(state.selection.year));
  if (state.selection.term) assignments = assignments.filter(a => String(assignmentParts(a).term?.id) === String(state.selection.term));
  if (state.selection.class) assignments = assignments.filter(a => String(assignmentParts(a).classItem?.id) === String(state.selection.class));
  return {
    classes: unique(assignments.map(a => assignmentParts(a).classItem)),
    subjects: unique(assignments.map(a => assignmentParts(a).subject)),
    terms: unique(c.assignments.map(a => assignmentParts(a).term))
  };
}

function renderContext() {
  const c = state.context; const available = availableContext();
  const allTerms = c.scope === 'school' ? c.terms : unique(c.assignments.map(a => assignmentParts(a).term));
  const years = academicYears(allTerms);
  const yearTerms = termsForYear(allTerms, state.selection.year);
  if (!yearTerms.some(t => String(t.id) === String(state.selection.term))) state.selection.term = yearTerms[0]?.id || '';
  if (!available.classes.some(item => String(item.id) === String(state.selection.class))) state.selection.class = '';
  if (!available.subjects.some(item => String(item.id) === String(state.selection.subject))) state.selection.subject = '';
  document.getElementById('contextArea').innerHTML = `
    <div class="filter-grid">
      <div class="field"><label for="assessmentYear">Academic Year</label><select id="assessmentYear"><option value="">All years</option>${years.map(y => option(y.id, y.name, state.selection.year)).join('')}</select></div>
      <div class="field"><label for="assessmentTerm">Term *</label><select id="assessmentTerm"><option value="">Select term…</option>${yearTerms.map(t => option(t.id, t.name + (t.is_current ? ' (Current)' : ''), state.selection.term)).join('')}</select></div>
      <div class="field"><label for="assessmentClass">Class *</label><select id="assessmentClass"><option value="">Select class…</option>${available.classes.map(item => option(item.id, item.name, state.selection.class)).join('')}</select></div>
      <div class="field"><label for="assessmentSubject">Subject *</label><select id="assessmentSubject" ${state.selection.class ? '' : 'disabled'}><option value="">Select subject…</option>${available.subjects.map(item => option(item.id, item.name + (item.code ? ` (${item.code})` : ''), state.selection.subject)).join('')}</select></div>
      <div class="field"><label for="assessmentType">Assessment Type *</label><select id="assessmentType"><option value="continuous"${selected('continuous', state.selection.type)}>Continuous Assessment</option><option value="end_term"${selected('end_term', state.selection.type)}>End-Term Assessment</option></select></div>
    </div>`;
  ['Year','Term','Class','Subject','Type'].forEach(name => document.getElementById('assessment' + name).addEventListener('change', event => changeContext(name.toLowerCase(), event.target.value)));
  maybeLoadRoster();
}

function changeContext(key, value) {
  if (state.dirty.size && !confirm('Discard unsaved assessment changes and switch context?')) { renderContext(); return; }
  state.dirty.clear(); state.learners = []; state.selection[key] = value;
  if (key === 'year') { state.selection.term = ''; state.selection.class = ''; state.selection.subject = ''; }
  if (key === 'term') { state.selection.class = ''; state.selection.subject = ''; }
  if (key === 'class') state.selection.subject = '';
  document.getElementById('rosterArea').innerHTML = MGAEMS.emptyStateHTML('Select an assessment context', 'Complete the filters above to load active learners.', 'clipboard-check');
  renderContext(); MGAEMS.initIcons();
}

function contextQuery() {
  return new URLSearchParams({ class_id: state.selection.class, subject_id: state.selection.subject, term_id: state.selection.term, assessment_type: state.selection.type });
}
function maybeLoadRoster() { if (state.selection.class && state.selection.subject && state.selection.term && state.selection.type) loadRoster(); }
async function loadRoster() {
  const wrap = document.getElementById('rosterArea');
  wrap.innerHTML = MGAEMS.loadingHTML('Loading learner roster…');
  const signature = contextQuery().toString();
  const res = await MGAEMS.get('/api/v1/assessments/learners?' + signature);
  if (signature !== contextQuery().toString()) return;
  if (!res.ok) { wrap.innerHTML = res.status === 403 ? MGAEMS.emptyStateHTML('Context not authorized', res.error, 'shield-alert') : MGAEMS.errorHTML(res.error); MGAEMS.initIcons(); return; }
  state.learners = res.data.map(learner => ({ ...learner, draft: valuesFromAssessment(learner.assessment), saveState: 'unchanged', error: '' }));
  state.dirty.clear(); renderRoster();
}
function valuesFromAssessment(a) { return { score: a?.score ?? '', competency_rating: a?.competency_rating ?? '', remarks: a?.remarks ?? '' }; }
function renderRoster() {
  const wrap = document.getElementById('rosterArea');
  if (!state.learners.length) { wrap.innerHTML = MGAEMS.emptyStateHTML('No active learners', 'There are no active learners in the selected class.', 'users'); MGAEMS.initIcons(); return; }
  wrap.innerHTML = `
    <div style="padding:var(--space-4)">
      <div class="assessment-actions"><div class="context-summary"><strong>${state.learners.length} learner${state.learners.length === 1 ? '' : 's'}</strong> · Enter a score, competency rating, or remark.</div><button id="saveAllBtn" class="btn btn-primary" onclick="saveAll()" disabled><i data-lucide="save"></i> Save Modified</button></div>
      <div class="table-scroll"><table class="assessment-table"><thead><tr><th>Admission No.</th><th>Learner</th><th>Score</th><th>CBC Competency Rating</th><th>Remarks</th><th>Status</th><th><span class="sr-only">Action</span></th></tr></thead><tbody>
      ${state.learners.map((learner, index) => `<tr data-index="${index}"><td>${escapeHTML(learner.admission_no)}</td><td><strong>${escapeHTML(learner.first_name)} ${escapeHTML(learner.last_name)}</strong></td><td><input class="score-input" type="number" min="0" max="100" step="0.01" aria-label="Score for ${escapeHTML(learner.first_name)} ${escapeHTML(learner.last_name)}" value="${escapeHTML(learner.draft.score)}"></td><td><select class="rating-input" aria-label="Competency rating for ${escapeHTML(learner.first_name)} ${escapeHTML(learner.last_name)}"><option value="">Not rated</option>${ratingLabels.map(label => option(label, label, learner.draft.competency_rating)).join('')}</select></td><td><input class="remarks-input" type="text" maxlength="1000" aria-label="Remarks for ${escapeHTML(learner.first_name)} ${escapeHTML(learner.last_name)}" placeholder="Optional remark" value="${escapeHTML(learner.draft.remarks)}"></td><td class="row-status" aria-live="polite"></td><td><button class="btn btn-secondary btn-sm row-save" onclick="saveRow(${index})" disabled><i data-lucide="save"></i> Save</button></td></tr>`).join('')}
      </tbody></table></div>
    </div>`;
  wrap.querySelectorAll('tbody tr').forEach((row, index) => row.querySelectorAll('input,select').forEach(input => input.addEventListener('input', () => updateDraft(index, row))));
  state.learners.forEach((_, index) => updateRowStatus(index)); MGAEMS.initIcons();
}
function updateDraft(index, row) {
  const learner = state.learners[index];
  learner.draft = { score: row.querySelector('.score-input').value, competency_rating: row.querySelector('.rating-input').value, remarks: row.querySelector('.remarks-input').value };
  learner.saveState = 'modified'; learner.error = ''; state.dirty.add(index); updateRowStatus(index);
}
function updateRowStatus(index) {
  const row = document.querySelector(`#rosterArea tr[data-index="${index}"]`); if (!row) return;
  const learner = state.learners[index];
  const labels = { unchanged:['badge-gray','Unchanged'], modified:['badge-amber','Unsaved'], saving:['badge-navy','Saving…'], saved:['badge-green','Saved'], failed:['badge-red','Failed'] };
  const [badge, label] = labels[learner.saveState] || labels.unchanged;
  row.classList.toggle('row-dirty', learner.saveState === 'modified'); row.classList.toggle('row-error', learner.saveState === 'failed'); row.classList.toggle('row-saving', learner.saveState === 'saving');
  row.querySelector('.row-status').innerHTML = `<span class="badge ${badge}" title="${escapeHTML(learner.error)}">${label}</span>${learner.error ? `<div class="field-error">${escapeHTML(learner.error)}</div>` : ''}`;
  row.querySelector('.row-save').disabled = !['modified','failed'].includes(learner.saveState) || state.saving.has(index);
  const saveAll = document.getElementById('saveAllBtn'); if (saveAll) saveAll.disabled = !state.dirty.size || state.saving.size > 0;
  MGAEMS.initIcons();
}
async function saveRow(index, quiet = false) {
  if (state.saving.has(index)) return false;
  const learner = state.learners[index]; const score = learner.draft.score;
  if (score !== '' && (!Number.isFinite(Number(score)) || Number(score) < 0 || Number(score) > 100)) { learner.saveState = 'failed'; learner.error = 'Score must be between 0 and 100.'; updateRowStatus(index); return false; }
  state.saving.add(index); learner.saveState = 'saving'; learner.error = ''; updateRowStatus(index);
  const res = await MGAEMS.post('/api/v1/assessments', { class_id: Number(state.selection.class), subject_id: Number(state.selection.subject), term_id: Number(state.selection.term), assessment_type: state.selection.type, student_id: learner.id, score: score === '' ? null : Number(score), competency_rating: learner.draft.competency_rating || null, remarks: learner.draft.remarks.trim() || null });
  state.saving.delete(index);
  if (!res.ok) { learner.saveState = 'failed'; learner.error = res.fields ? Object.values(res.fields).flat()[0] : res.error; updateRowStatus(index); if (!quiet) MGAEMS.toast(`Could not save ${learner.first_name}: ${learner.error}`, 'error'); return false; }
  learner.assessment = res.data; learner.draft = valuesFromAssessment(res.data); learner.saveState = 'saved'; state.dirty.delete(index); updateRowStatus(index); if (!quiet) MGAEMS.toast(`${learner.first_name}'s assessment was saved.`, 'success'); return true;
}
async function saveAll() {
  const indexes = [...state.dirty]; const button = document.getElementById('saveAllBtn'); if (button) button.disabled = true;
  let saved = 0; for (const index of indexes) if (await saveRow(index, true)) saved++;
  if (saved) MGAEMS.toast(`${saved} assessment row${saved === 1 ? '' : 's'} saved.`, 'success');
  if (saved < indexes.length) MGAEMS.toast(`${indexes.length - saved} row${indexes.length - saved === 1 ? '' : 's'} could not be saved. Review the highlighted rows.`, 'error');
}

function renderReportWorkspace() {
  const area = document.getElementById('reportArea');
  if (!canGenerateReports) { area.innerHTML = `<div class="card">${MGAEMS.emptyStateHTML('Report cards are administrator managed', 'You can enter assessments above. Report-card generation is available to authorized school leaders.', 'shield')}</div>`; MGAEMS.initIcons(); return; }
  const terms = state.context?.scope === 'school' ? state.context.terms : [];
  const years = academicYears(terms); const classes = state.context?.classes || [];
  area.innerHTML = `<div class="card section"><div class="section-header"><div><h2>Report Card Selection</h2><div class="text-muted">Select the learner and reporting term before generating a PDF.</div></div></div><div class="filter-grid" style="grid-template-columns:repeat(4,minmax(150px,1fr))"><div class="field"><label for="reportYear">Academic Year</label><select id="reportYear"><option value="">Select year…</option>${years.map(y => option(y.id,y.name,'')).join('')}</select></div><div class="field"><label for="reportTerm">Term *</label><select id="reportTerm" disabled><option value="">Select term…</option></select></div><div class="field"><label for="reportClass">Class *</label><select id="reportClass"><option value="">Select class…</option>${classes.map(c => option(c.id,c.name,'')).join('')}</select></div><div class="field"><label for="reportLearner">Learner *</label><select id="reportLearner" disabled><option value="">Select learner…</option></select></div></div></div><div class="card" id="reportState">${MGAEMS.emptyStateHTML('Select a learner and term', 'Existing report-card status will appear here.', 'file-text')}</div>`;
  document.getElementById('reportYear').addEventListener('change', updateReportTerms);
  document.getElementById('reportTerm').addEventListener('change', loadReportState);
  document.getElementById('reportClass').addEventListener('change', loadReportLearners);
  document.getElementById('reportLearner').addEventListener('change', loadReportState); MGAEMS.initIcons();
}
function updateReportTerms() { const id = document.getElementById('reportYear').value; const terms = termsForYear(state.context.terms,id); const el = document.getElementById('reportTerm'); el.disabled = !id; el.innerHTML = '<option value="">Select term…</option>' + terms.map(t => option(t.id,t.name + (t.is_current ? ' (Current)' : ''),'')).join(''); clearReportState(); }
async function loadReportLearners() { const classId = document.getElementById('reportClass').value; const el = document.getElementById('reportLearner'); el.disabled = true; el.innerHTML = '<option value="">Loading learners…</option>'; clearReportState(); if (!classId) { el.innerHTML = '<option value="">Select learner…</option>'; return; } const res = await MGAEMS.get(`/api/v1/students?class_id=${encodeURIComponent(classId)}&status=active&per_page=100`); if (!res.ok) { el.innerHTML = '<option value="">Unable to load learners</option>'; MGAEMS.toast(res.error,'error'); return; } state.reportLearners = res.data; el.innerHTML = '<option value="">Select learner…</option>' + res.data.map(s => option(s.id,`${s.first_name} ${s.last_name} — ${s.admission_no}`,'')).join(''); el.disabled = !res.data.length; if (!res.data.length) document.getElementById('reportState').innerHTML = MGAEMS.emptyStateHTML('No active learners', 'This class has no active learners.', 'users'); }
function clearReportState() { state.reportCard = null; const el = document.getElementById('reportState'); if (el) { el.innerHTML = MGAEMS.emptyStateHTML('Select a learner and term', 'Existing report-card status will appear here.', 'file-text'); MGAEMS.initIcons(); } }
async function loadReportState() { const studentId = document.getElementById('reportLearner').value; const termId = document.getElementById('reportTerm').value; if (!studentId || !termId) { clearReportState(); return; } const box = document.getElementById('reportState'); box.innerHTML = MGAEMS.loadingHTML('Checking report-card status…'); const res = await MGAEMS.get(`/api/v1/report-cards?student_id=${encodeURIComponent(studentId)}&term_id=${encodeURIComponent(termId)}`); if (!res.ok) { box.innerHTML = MGAEMS.errorHTML(res.error); MGAEMS.initIcons(); return; } state.reportCard = res.data; renderReportState(); }
function reportSelection() { const student = state.reportLearners.find(s => String(s.id) === document.getElementById('reportLearner').value); const term = state.context.terms.find(t => String(t.id) === document.getElementById('reportTerm').value); return { student, term }; }
function renderReportState() { const box = document.getElementById('reportState'); const {student,term} = reportSelection(); const card = state.reportCard; box.innerHTML = `<div class="report-state"><div class="meta"><h2>${escapeHTML(student.first_name)} ${escapeHTML(student.last_name)}</h2><span>${escapeHTML(student.admission_no)} · ${escapeHTML(term.name)}</span>${card ? `<span><span class="badge badge-green">Generated</span> ${card.generated_at ? `Generated ${escapeHTML(new Date(card.generated_at).toLocaleString())}` : ''}</span>` : '<span><span class="badge badge-gray">Not generated</span> No report card has been confirmed for this term.</span>'}</div><div class="flex gap-2">${card ? '<button class="btn btn-secondary" onclick="downloadReport()"><i data-lucide="download"></i> Download PDF</button>' : ''}<button class="btn btn-primary" onclick="openGenerateModal()"><i data-lucide="file-plus-2"></i> ${card ? 'Regenerate' : 'Generate'}</button></div></div>`; MGAEMS.initIcons(); }
function openGenerateModal() { const {student,term} = reportSelection(); const card = state.reportCard; const overlay = document.createElement('div'); overlay.className = 'modal-overlay'; overlay.setAttribute('role','presentation'); overlay.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="generateTitle"><div class="modal-header"><h2 id="generateTitle">${card ? 'Regenerate' : 'Generate'} Report Card</h2><button class="modal-close" aria-label="Close dialog" onclick="closeGenerateModal()"><i data-lucide="x"></i></button></div><div class="modal-body"><div id="generateAlert"></div><p>Prepare the report card for <strong>${escapeHTML(student.first_name)} ${escapeHTML(student.last_name)}</strong> (${escapeHTML(student.admission_no)}) for <strong>${escapeHTML(term.name)}</strong>.</p>${card ? '<div class="alert alert-error"><i data-lucide="alert-triangle"></i><span>This replaces the currently generated PDF with the latest assessment data.</span></div>' : ''}<div class="field"><label for="overallRemark">Overall Remark (optional)</label><textarea id="overallRemark" rows="4" placeholder="Add an overall learner remark…">${escapeHTML(card?.overall_remark || '')}</textarea></div></div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeGenerateModal()">Cancel</button><button class="btn btn-primary" id="confirmGenerate" onclick="generateReport()"><i data-lucide="file-check-2"></i> Confirm ${card ? 'Regeneration' : 'Generation'}</button></div></div>`; document.body.appendChild(overlay); MGAEMS.initIcons(); document.getElementById('overallRemark').focus(); overlay.addEventListener('keydown', e => { if (e.key === 'Escape') closeGenerateModal(); }); }
function closeGenerateModal() { document.querySelector('.modal-overlay')?.remove(); }
async function generateReport() { const {student} = reportSelection(); const termId = Number(document.getElementById('reportTerm').value); const button = document.getElementById('confirmGenerate'); button.disabled = true; button.innerHTML = '<span class="spinner" style="width:15px;height:15px;margin:0"></span> Generating…'; const remark = document.getElementById('overallRemark').value.trim(); const res = await MGAEMS.post(`/api/v1/students/${student.id}/report-cards/generate`, { term_id: termId, overall_remark: remark || null }); if (!res.ok) { document.getElementById('generateAlert').innerHTML = MGAEMS.errorHTML(res.error); button.disabled = false; button.textContent = 'Try Again'; MGAEMS.initIcons(); return; } state.reportCard = res.data; closeGenerateModal(); renderReportState(); MGAEMS.toast('Report card generated successfully.','success'); }
async function downloadReport() { if (!state.reportCard) return; try { const response = await fetch(`/api/v1/report-cards/${state.reportCard.id}/download`, { headers: { Accept:'application/pdf', Authorization:'Bearer ' + localStorage.getItem('mgaems_token') } }); if (response.status === 401) { MGAEMS.logout(); return; } if (!response.ok) { const body = await response.json().catch(() => ({})); throw new Error(body.error?.message || (response.status === 404 ? 'The report-card PDF is missing.' : 'The report card could not be downloaded.')); } const blob = await response.blob(); const {student,term} = reportSelection(); const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = `report-card-${student.admission_no}-${term.name}`.replace(/[^a-z0-9.-]+/gi,'-') + '.pdf'; document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url); } catch (error) { MGAEMS.toast(error.message,'error'); } }

window.addEventListener('beforeunload', event => { if (state.dirty.size) { event.preventDefault(); event.returnValue = ''; } });
loadContext().then(renderReportWorkspace);
</script>
</body>
</html>
