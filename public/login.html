<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGAEMS ? Sign In</title>
<script src="/assets/app.js"></script>
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/login.css">
<script defer src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="login-page">
<main class="card login-card" aria-labelledby="loginHeading">
  <div class="login-brand-mark" role="img" aria-label="Manna Goodnews Academy">MG</div>
  <h1 id="loginHeading">Manna Goodnews Academy</h1>
  <p class="sub">Education Management System</p>
  <p class="login-introduction">Sign in to your authorized school workspace.</p>
  <form id="loginForm">
    <div id="alertBox" data-form-error role="alert" tabindex="-1"></div>
    <div class="field"><label for="username">Username</label><input type="text" id="username" name="username" maxlength="100" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div class="field"><label for="password">Password</label><div class="login-password"><input type="password" id="password" name="password" autocomplete="current-password" required><button class="btn btn-secondary" type="button" id="passwordToggle" aria-controls="password" aria-pressed="false">Show</button></div></div>
    <button class="btn btn-primary" type="submit" id="loginBtn"><i data-lucide="log-in" aria-hidden="true"></i><span id="loginBtnLabel">Sign In</span></button>
    <p id="loginStatus" role="status"></p>
  </form>
  <div class="login-footer"><p>For account access or recovery, contact an authorized school administrator.</p><button type="button" class="btn btn-secondary icon-control" data-theme-toggle aria-label="Switch theme"></button></div>
</main>
<script src="/assets/login.js"></script>
</body>
</html>
