<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGAEMS — Sign In</title>
<script src="/assets/app.js"></script>
<link rel="stylesheet" href="/assets/app.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="login-page">
  <div class="card login-card">
    <img src="/storage/school/DsN4QKTH9nHqIbLiOM7ha8HIjUHyUfOPjcKnBdgq.jpg" alt="" onerror="this.style.display='none'">
    <h1>Manna Goodnews Academy</h1>
    <div class="sub">Education Management System</div>

    <div id="alertBox"></div>

    <div class="field" style="text-align:left">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username">
    </div>
    <div class="field" style="text-align:left">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>

    <button class="btn btn-primary" id="loginBtn" onclick="login()">
      <i data-lucide="log-in"></i> <span id="loginBtnLabel">Sign In</span>
    </button>
    <button type="button" class="btn btn-secondary icon-control" data-theme-toggle aria-label="Switch theme"></button>
  </div>

<script>
lucide.createIcons();
MGAEMS.initThemeControls();

async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const btnLabel = document.getElementById('loginBtnLabel');
  const alertBox = document.getElementById('alertBox');
  alertBox.innerHTML = '';

  if (!username || !password) {
    alertBox.innerHTML = MGAEMS.errorHTML('Please enter both your username and password.');
    lucide.createIcons();
    return;
  }

  btn.disabled = true;
  btnLabel.textContent = 'Signing in…';

  try {
    const res = await fetch('/api/v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (!res.ok) {
      const message = data.message || (data.error && data.error.message) || 'Login failed. Check your details and try again.';
      alertBox.innerHTML = MGAEMS.errorHTML(message);
      lucide.createIcons();
      btn.disabled = false;
      btnLabel.textContent = 'Sign In';
      return;
    }

    localStorage.setItem('mgaems_token', data.data.token);
    localStorage.setItem('mgaems_user', JSON.stringify(data.data.user));
    const role = data.data.user.role;
    window.location.href = role === 'parent_guardian' ? '/parent-portal.html'
      : role === 'sponsor' ? '/sponsor-portal.html' : '/dashboard.html';
  } catch (e) {
    alertBox.innerHTML = MGAEMS.errorHTML('Could not reach the server. Is it running?');
    lucide.createIcons();
    btn.disabled = false;
    btnLabel.textContent = 'Sign In';
  }
}

document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
