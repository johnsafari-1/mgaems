<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MGAEMS — Academic Structure</title>
<link rel="stylesheet" href="/assets/app.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<script src="/assets/app.js"></script>
<script src="/assets/nav.js"></script>
<script>
MGAEMS.requireAuth();
renderAppShell('/academic.html', '/storage/school/DsN4QKTH9nHqIbLiOM7ha8HIjUHyUfOPjcKnBdgq.jpg');
MGAEMS.initSidebar();

const WRITE_ROLES = ['system_admin', 'head_teacher', 'deputy_head_teacher'];
const YEAR_TERM_WRITE_ROLES = ['system_admin', 'head_teacher'];
const canWriteStructure = WRITE_ROLES.includes(MGAEMS.currentUser().role);
const canWriteCalendar = YEAR_TERM_WRITE_ROLES.includes(MGAEMS.currentUser().role);

let classesCache = [];
let streamsCache = [];
let subjectsCache = [];
let yearsCache = [];
let termsCache = [];
let staffCache = [];

document.getElementById('appMain').innerHTML = `
  <h1 style="margin-bottom:var(--space-4)">Academic Structure</h1>
  <div class="tabs" id="mainTabs">
    <div class="tab active" data-tab="years">Academic Years</div>
    <div class="tab" data-tab="terms">Terms</div>
    <div class="tab" data-tab="classes">Classes</div>
    <div class="tab" data-tab="streams">Streams</div>
    <div class="tab" data-tab="subjects">Subjects</div>
    <div class="tab" data-tab="assignments">Teacher Assignments</div>
    <div class="tab" data-tab="timetable">Timetable</div>
  </div>

  <div class="tab-panel active" data-panel="years">
    <div class="section-header">
      <h2>Academic Years</h2>
      ${canWriteCalendar ? '<button class="btn btn-primary btn-sm" onclick="openYearModal()"><i data-lucide="plus"></i> Add Year</button>' : ''}
    </div>
    <div class="card" id="yearsCard" style="padding:0">${MGAEMS.loadingHTML()}</div>
  </div>

  <div class="tab-panel" data-panel="terms">
    <div class="section-header">
      <h2>Terms</h2>
      ${canWriteCalendar ? '<button class="btn btn-primary btn-sm" onclick="openTermModal()"><i data-lucide="plus"></i> Add Term</button>' : ''}
    </div>
    <div class="card" id="termsCard" style="padding:0">${MGAEMS.loadingHTML()}</div>
  </div>

  <div class="tab-panel" data-panel="classes">
    <div class="section-header">
      <h2>Classes</h2>
      ${canWriteStructure ? '<button class="btn btn-primary btn-sm" onclick="openClassModal()"><i data-lucide="plus"></i> Add Class</button>' : ''}
    </div>
    <div class="card" id="classesCard" style="padding:0">${MGAEMS.loadingHTML()}</div>
  </div>

  <div class="tab-panel" data-panel="streams">
    <div class="section-header">
      <h2>Streams</h2>
      ${canWriteStructure ? '<button class="btn btn-primary btn-sm" onclick="openStreamModal()"><i data-lucide="plus"></i> Add Stream</button>' : ''}
    </div>
    <div class="card" id="streamsCard" style="padding:0">${MGAEMS.loadingHTML()}</div>
  </div>

  <div class="tab-panel" data-panel="subjects">
    <div class="section-header">
      <h2>Subjects</h2>
      ${canWriteStructure ? '<button class="btn btn-primary btn-sm" onclick="openSubjectModal()"><i data-lucide="plus"></i> Add Subject</button>' : ''}
    </div>
    <div class="card" id="subjectsCard" style="padding:0">${MGAEMS.loadingHTML()}</div>
  </div>

  <div class="tab-panel" data-panel="assignments">
    <div class="section-header">
      <h2>Teacher Subject Assignments</h2>
      ${canWriteStructure ? '<button class="btn btn-primary btn-sm" onclick="openAssignmentModal()"><i data-lucide="plus"></i> New Assignment</button>' : ''}
    </div>
    <div class="card" id="assignmentsCard" style="padding:0">${MGAEMS.loadingHTML()}</div>
  </div>

  <div class="tab-panel" data-panel="timetable">
    <div class="section-header">
      <h2>Class Timetable</h2>
      ${canWriteStructure ? '<button class="btn btn-primary btn-sm" onclick="openTimetableModal()"><i data-lucide="plus"></i> Add Entry</button>' : ''}
    </div>
    <div class="toolbar">
      <select id="timetableClassFilter"><option value="">Select a class…</option></select>
    </div>
    <div class="card" id="timetableCard" style="padding:0">
      ${MGAEMS.emptyStateHTML('Select a class', 'Choose a class above to view its timetable.', 'calendar')}
    </div>
  </div>
`;
lucide.createIcons();

document.querySelectorAll('#mainTabs .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#mainTabs .tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.app-main > .tab-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.querySelector(`.tab-panel[data-panel="${tab.dataset.tab}"]`).classList.add('active');
  });
});

const DAY_NAMES = ['', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

/* ================= Academic Years ================= */

async function loadYears() {
  const el = document.getElementById('yearsCard');
  const res = await MGAEMS.get('/api/v1/academic-years');
  if (!res.ok) { el.innerHTML = MGAEMS.errorHTML(res.error); lucide.createIcons(); return; }
  yearsCache = res.data;
  if (res.data.length === 0) {
    el.innerHTML = MGAEMS.emptyStateHTML('No academic years yet', 'Add your first academic year to get started.', 'calendar-range');
    lucide.createIcons();
    return;
  }
  el.innerHTML = `
    <table>
      <thead><tr><th>Name</th><th>Start Date</th><th>End Date</th><th>Status</th><th></th></tr></thead>
      <tbody>${res.data.map(y => `
        <tr>
          <td>${y.name}</td>
          <td>${y.start_date.slice(0,10)}</td>
          <td>${y.end_date.slice(0,10)}</td>
          <td>${y.is_current ? '<span class="badge badge-green">Current</span>' : '<span class="badge badge-gray">Inactive</span>'}</td>
          <td>${canWriteCalendar ? `
            <div class="flex gap-2">
              ${!y.is_current ? `<button class="btn btn-secondary btn-sm" onclick="activateYear(${y.id})">Activate</button>` : ''}
              <button class="btn btn-secondary btn-sm" onclick="deleteYear(${y.id})"><i data-lucide="trash-2"></i></button>
            </div>` : ''}
          </td>
        </tr>`).join('')}</tbody>
    </table>`;
  lucide.createIcons();
}

function openYearModal() {
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal-header"><h2>Add Academic Year</h2><button class="modal-close" onclick="this.closest('.modal-overlay').remove()"><i data-lucide="x"></i></button></div>
        <div class="modal-body">
          <div id="yearAlert"></div>
          <div class="field"><label>Name *</label><input type="text" id="y_name" placeholder="e.g. 2027"></div>
          <div class="field"><label>Start Date *</label><input type="date" id="y_start"></div>
          <div class="field"><label>End Date *</label><input type="date" id="y_end"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
          <button class="btn btn-primary" onclick="submitYear()">Save</button>
        </div>
      </div>
    </div>`);
  lucide.createIcons();
}

async function submitYear() {
  const alertBox = document.getElementById('yearAlert');
  const res = await MGAEMS.post('/api/v1/academic-years', {
    name: document.getElementById('y_name').value.trim(),
    start_date: document.getElementById('y_start').value,
    end_date: document.getElementById('y_end').value,
  });
  if (!res.ok) { alertBox.innerHTML = MGAEMS.errorHTML(res.error); lucide.createIcons(); return; }
  document.querySelector('.modal-overlay').remove();
  MGAEMS.toast('Academic year added', 'success');
  loadYears();
}

async function activateYear(id) {
  const res = await MGAEMS.post(`/api/v1/academic-years/${id}/activate`, {});
  if (!res.ok) { MGAEMS.toast(res.error, 'error'); return; }
  MGAEMS.toast('Academic year activated', 'success');
  loadYears();
}

async function deleteYear(id) {
  if (!confirm('Delete this academic year? This cannot be undone.')) return;
  const res = await MGAEMS.del(`/api/v1/academic-years/${id}`);
  if (!res.ok) { MGAEMS.toast(res.error, 'error'); return; }
  MGAEMS.toast('Academic year deleted', 'success');
  loadYears();
}

/* ================= Terms ================= */

async function loadTerms() {
  const el = document.getElementById('termsCard');
  const res = await MGAEMS.get('/api/v1/terms');
  if (!res.ok) { el.innerHTML = MGAEMS.errorHTML(res.error); lucide.createIcons(); return; }
  termsCache = res.data;
  if (res.data.length === 0) {
    el.innerHTML = MGAEMS.emptyStateHTML('No terms yet', 'Add a term within an academic year.', 'calendar-check');
    lucide.createIcons();
    return;
  }
  el.innerHTML = `
    <table>
      <thead><tr><th>Term</th><th>Academic Year</th><th>Start</th><th>End</th><th>Status</th><th></th></tr></thead>
      <tbody>${res.data.map(t => `
        <tr>
          <td>${t.name}</td>
          <td>${t.academic_year ? t.academic_year.name : '—'}</td>
          <td>${t.start_date.slice(0,10)}</td>
          <td>${t.end_date.slice(0,10)}</td>
          <td>${t.is_current ? '<span class="badge badge-green">Current</span>' : '<span class="badge badge-gray">Inactive</span>'}</td>
          <td>${canWriteCalendar ? `
            <div class="flex gap-2">
              ${!t.is_current ? `<button class="btn btn-secondary btn-sm" onclick="activateTerm(${t.id})">Activate</button>` : ''}
              <button class="btn btn-secondary btn-sm" onclick="deleteTerm(${t.id})"><i data-lucide="trash-2"></i></button>
            </div>` : ''}
          </td>
        </tr>`).join('')}</tbody>
    </table>`;
  lucide.createIcons();
}

function openTermModal() {
  const yearOptions = yearsCache.map(y => `<option value="${y.id}">${y.name}</option>`).join('');
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal-header"><h2>Add Term</h2><button class="modal-close" onclick="this.closest('.modal-overlay').remove()"><i data-lucide="x"></i></button></div>
        <div class="modal-body">
          <div id="termAlert"></div>
          <div class="field"><label>Academic Year *</label><select id="t_year">${yearOptions}</select></div>
          <div class="field"><label>Term Name *</label><input type="text" id="t_name" placeholder="e.g. Term 1"></div>
          <div class="field"><label>Start Date *</label><input type="date" id="t_start"></div>
          <div class="field"><label>End Date *</label><input type="date" id="t_end"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
          <button class="btn btn-primary" onclick="submitTerm()">Save</button>
        </div>
      </div>
    </div>`);
  lucide.createIcons();
}

async function submitTerm() {
  const alertBox = document.getElementById('termAlert');
  const res = await MGAEMS.post('/api/v1/terms', {
    academic_year_id: document.getElementById('t_year').value,
    name: document.getElementById('t_name').value.trim(),
    start_date: document.getElementById('t_start').value,
    end_date: document.getElementById('t_end').value,
  });
  if (!res.ok) { alertBox.innerHTML = MGAEMS.errorHTML(res.error); lucide.createIcons(); return; }
  document.querySelector('.modal-overlay').remove();
  MGAEMS.toast('Term added', 'success');
  loadTerms();
}

async function activateTerm(id) {
  const res = await MGAEMS.post(`/api/v1/terms/${id}/activate`, {});
  if (!res.ok) { MGAEMS.toast(res.error, 'error'); return; }
  MGAEMS.toast('Term activated', 'success');
  loadTerms();
}

async function deleteTerm(id) {
  if (!confirm('Delete this term?')) return;
  const res = await MGAEMS.del(`/api/v1/terms/${id}`);
  if (!res.ok) { MGAEMS.toast(res.error, 'error'); return; }
  MGAEMS.toast('Term deleted', 'success');
  loadTerms();
}

/* ================= Classes ================= */

async function loadClasses() {
  const el = document.getElementById('classesCard');
  const res = await MGAEMS.get('/api/v1/classes');
  if (!res.ok) { el.innerHTML = MGAEMS.errorHTML(res.error); lucide.createIcons(); return; }
  classesCache = res.data;
  populateClassFilters();
  if (res.data.length === 0) {
    el.innerHTML = MGAEMS.emptyStateHTML('No classes yet', 'Add your first class to get started.', 'book-open');
    lucide.createIcons();
    return;
  }
  el.innerHTML = `
    <table>
      <thead><tr><th>Name</th><th>Level</th><th>Capacity</th><th>Learners</th><th>Class Teacher</th><th></th></tr></thead>
      <tbody>${res.data.map(c => `
        <tr>
          <td>${c.name}</td>
          <td><span class="badge badge-navy">${c.level}</span></td>
          <td>${c.capacity ?? '—'}</td>
          <td>${c.students_count ?? 0}</td>
          <td>${c.class_teacher ? c.class_teacher.first_name + ' ' + c.class_teacher.last_name : '—'}</td>
          <td>${canWriteStructure ? `<button class="btn btn-secondary btn-sm" onclick="deleteClass(${c.id})"><i data-lucide="trash-2"></i></button>` : ''}</td>
        </tr>`).join('')}</tbody>
    </table>`;
  lucide.createIcons();
}

async function openClassModal() {
  if (staffCache.length === 0) await loadStaffCache();
  const staffOptions = staffCache.map(s => `<option value="${s.id}">${s.first_name} ${s.last_name}</option>`).join('');
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal-header"><h2>Add Class</h2><button class="modal-close" onclick="this.closest('.modal-overlay').remove()"><i data-lucide="x"></i></button></div>
        <div class="modal-body">
          <div id="classAlert"></div>
          <div class="form-grid">
            <div class="field"><label>Name *</label><input type="text" id="c_name" placeholder="e.g. Grade 3"></div>
            <div class="field"><label>Level *</label><select id="c_level"><option value="primary">Primary</option><option value="junior">Junior</option></select></div>
            <div class="field"><label>Sequence *</label><input type="number" id="c_sequence" min="1"></div>
            <div class="field"><label>Capacity</label><input type="number" id="c_capacity" min="1"></div>
            <div class="field full"><label>Class Teacher</label><select id="c_teacher"><option value="">None</option>${staffOptions}</select></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
          <button class="btn btn-primary" onclick="submitClass()">Save</button>
        </div>
      </div>
    </div>`);
  lucide.createIcons();
}

async function submitClass() {
  const alertBox = document.getElementById('classAlert');
  const teacherId = document.getElementById('c_teacher').value;
  const res = await MGAEMS.post('/api/v1/classes', {
    name: document.getElementById('c_name').value.trim(),
    level: document.getElementById('c_level').value,
    sequence: document.getElementById('c_sequence').value,
    capacity: document.getElementById('c_capacity').value || null,
    class_teacher_id: teacherId || null,
  });
  if (!res.ok) { alertBox.innerHTML = MGAEMS.errorHTML(res.error); lucide.createIcons(); return; }
  document.querySelector('.modal-overlay').remove();
  MGAEMS.toast('Class added', 'success');
  loadClasses();
}

async function deleteClass(id) {
  if (!confirm('Delete this class?')) return;
  const res = await MGAEMS.del(`/api/v1/classes/${id}`);
  if (!res.ok) { MGAEMS.toast(res.error, 'error'); return; }
  MGAEMS.toast('Class deleted', 'success');
  loadClasses();
}

function populateClassFilters() {
  const options = '<option value="">Select a class…</option>' + classesCache.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  const tf = document.getElementById('timetableClassFilter');
  if (tf) tf.innerHTML = options;
}

/* ================= Streams ================= */

async function loadStreams() {
  const el = document.getElementById('streamsCard');
  const res = await MGAEMS.get('/api/v1/streams');
  if (!res.ok) { el.innerHTML = MGAEMS.errorHTML(res.error); lucide.createIcons(); return; }
  streamsCache = res.data;
  if (res.data.length === 0) {
    el.innerHTML = MGAEMS.emptyStateHTML('No streams yet', 'Streams subdivide a class (e.g. Grade 4 Blue).', 'layers');
    lucide.createIcons();
    return;
  }
  el.innerHTML = `
    <table>
      <thead><tr><th>Stream</th><th>Class</th><th>Learners</th><th></th></tr></thead>
      <tbody>${res.data.map(s => `
        <tr>
          <td>${s.name}</td>
          <td>${s.school_class ? s.school_class.name : '—'}</td>
          <td>${s.students_count ?? 0}</td>
          <td>${canWriteStructure ? `<button class="btn btn-secondary btn-sm" onclick="deleteStream(${s.id})"><i data-lucide="trash-2"></i></button>` : ''}</td>
        </tr>`).join('')}</tbody>
    </table>`;
  lucide.createIcons();
}

function openStreamModal() {
  const classOptions = classesCache.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal-header"><h2>Add Stream</h2><button class="modal-close" onclick="this.closest('.modal-overlay').remove()"><i data-lucide="x"></i></button></div>
        <div class="modal-body">
          <div id="streamAlert"></div>
          <div class="field"><label>Class *</label><select id="s_class">${classOptions}</select></div>
          <div class="field"><label>Stream Name *</label><input type="text" id="s_name" placeholder="e.g. Blue"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
          <button class="btn btn-primary" onclick="submitStream()">Save</button>
        </div>
      </div>
    </div>`);
  lucide.createIcons();
}

async function submitStream() {
  const alertBox = document.getElementById('streamAlert');
  const res = await MGAEMS.post('/api/v1/streams', {
    class_id: document.getElementById('s_class').value,
    name: document.getElementById('s_name').value.trim(),
  });
  if (!res.ok) { alertBox.innerHTML = MGAEMS.errorHTML(res.error); lucide.createIcons(); return; }
  document.querySelector('.modal-overlay').remove();
  MGAEMS.toast('Stream added', 'success');
  loadStreams();
}

async function deleteStream(id) {
  if (!confirm('Delete this stream?')) return;
  const res = await MGAEMS.del(`/api/v1/streams/${id}`);
  if (!res.ok) { MGAEMS.toast(res.error, 'error'); return; }
  MGAEMS.toast('Stream deleted', 'success');
  loadStreams();
}

/* ================= Subjects ================= */

async function loadSubjects() {
  const el = document.getElementById('subjectsCard');
  const res = await MGAEMS.get('/api/v1/subjects');
  if (!res.ok) { el.innerHTML = MGAEMS.errorHTML(res.error); lucide.createIcons(); return; }
  subjectsCache = res.data;
  if (res.data.length === 0) {
    el.innerHTML = MGAEMS.emptyStateHTML('No subjects yet', 'Add your first subject.', 'book-marked');
    lucide.createIcons();
    return;
  }
  el.innerHTML = `
    <table>
      <thead><tr><th>Name</th><th>Code</th><th>Learning Area</th><th>Status</th><th></th></tr></thead>
      <tbody>${res.data.map(s => `
        <tr>
          <td>${s.name}</td>
          <td>${s.code || '—'}</td>
          <td>${s.learning_area || '—'}</td>
          <td><span class="badge ${s.status === 'active' ? 'badge-green' : 'badge-gray'}">${s.status}</span></td>
          <td>${canWriteStructure ? `<button class="btn btn-secondary btn-sm" onclick="deleteSubject(${s.id})"><i data-lucide="trash-2"></i></button>` : ''}</td>
        </tr>`).join('')}</tbody>
    </table>`;
  lucide.createIcons();
}

function openSubjectModal() {
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal-header"><h2>Add Subject</h2><button class="modal-close" onclick="this.closest('.modal-overlay').remove()"><i data-lucide="x"></i></button></div>
        <div class="modal-body">
          <div id="subjectAlert"></div>
          <div class="form-grid">
            <div class="field"><label>Name *</label><input type="text" id="sub_name" placeholder="e.g. Mathematics"></div>
            <div class="field"><label>Code</label><input type="text" id="sub_code" placeholder="e.g. MATH"></div>
            <div class="field full"><label>CBC Learning Area</label><input type="text" id="sub_area" placeholder="e.g. Mathematical Activities"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
          <button class="btn btn-primary" onclick="submitSubject()">Save</button>
        </div>
      </div>
    </div>`);
  lucide.createIcons();
}

async function submitSubject() {
  const alertBox = document.getElementById('subjectAlert');
  const res = await MGAEMS.post('/api/v1/subjects', {
    name: document.getElementById('sub_name').value.trim(),
    code: document.getElementById('sub_code').value.trim() || null,
    learning_area: document.getElementById('sub_area').value.trim() || null,
  });
  if (!res.ok) { alertBox.innerHTML = MGAEMS.errorHTML(res.error); lucide.createIcons(); return; }
  document.querySelector('.modal-overlay').remove();
  MGAEMS.toast('Subject added', 'success');
  loadSubjects();
}

async function deleteSubject(id) {
  if (!confirm('Delete this subject?')) return;
  const res = await MGAEMS.del(`/api/v1/subjects/${id}`);
  if (!res.ok) { MGAEMS.toast(res.error, 'error'); return; }
  MGAEMS.toast('Subject deleted', 'success');
  loadSubjects();
}

/* ================= Teacher Assignments ================= */

async function loadStaffCache() {
  const res = await MGAEMS.get('/api/v1/staff');
  if (res.ok) staffCache = res.data;
}

async function loadAssignments() {
  const el = document.getElementById('assignmentsCard');
  const res = await MGAEMS.get('/api/v1/teacher-assignments');
  if (!res.ok) {
    if (res.status === 403) { el.innerHTML = MGAEMS.emptyStateHTML('Not available', 'Your role does not have access to this section.', 'lock'); lucide.createIcons(); return; }
    el.innerHTML = MGAEMS.errorHTML(res.error); lucide.createIcons(); return;
  }
  if (res.data.length === 0) {
    el.innerHTML = MGAEMS.emptyStateHTML('No assignments yet', 'Assign a teacher to a subject and class.', 'user-check');
    lucide.createIcons();
    return;
  }
  el.innerHTML = `
    <table>
      <thead><tr><th>Teacher</th><th>Subject</th><th>Class</th><th>Stream</th><th>Term</th><th></th></tr></thead>
      <tbody>${res.data.map(a => `
        <tr>
          <td>${a.staff.first_name} ${a.staff.last_name}</td>
          <td>${a.subject.name}</td>
          <td>${a.school_class.name}</td>
          <td>${a.stream ? a.stream.name : '—'}</td>
          <td>${a.term.name}</td>
          <td>${canWriteStructure ? `<button class="btn btn-secondary btn-sm" onclick="deleteAssignment(${a.id})"><i data-lucide="trash-2"></i></button>` : ''}</td>
        </tr>`).join('')}</tbody>
    </table>`;
  lucide.createIcons();
}

async function openAssignmentModal() {
  if (staffCache.length === 0) await loadStaffCache();
  const classOptions = classesCache.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  const subjectOptions = subjectsCache.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  const staffOptions = staffCache.map(s => `<option value="${s.id}">${s.first_name} ${s.last_name}</option>`).join('');
  const termOptions = termsCache.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal-header"><h2>New Teacher Assignment</h2><button class="modal-close" onclick="this.closest('.modal-overlay').remove()"><i data-lucide="x"></i></button></div>
        <div class="modal-body">
          <div id="assignAlert"></div>
          <div class="form-grid">
            <div class="field"><label>Teacher *</label><select id="a_staff">${staffOptions}</select></div>
            <div class="field"><label>Subject *</label><select id="a_subject">${subjectOptions}</select></div>
            <div class="field"><label>Class *</label><select id="a_class">${classOptions}</select></div>
            <div class="field"><label>Term *</label><select id="a_term">${termOptions}</select></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
          <button class="btn btn-primary" onclick="submitAssignment()">Save</button>
        </div>
      </div>
    </div>`);
  lucide.createIcons();
}

async function submitAssignment() {
  const alertBox = document.getElementById('assignAlert');
  const res = await MGAEMS.post('/api/v1/teacher-assignments', {
    staff_id: document.getElementById('a_staff').value,
    subject_id: document.getElementById('a_subject').value,
    class_id: document.getElementById('a_class').value,
    term_id: document.getElementById('a_term').value,
  });
  if (!res.ok) { alertBox.innerHTML = MGAEMS.errorHTML(res.error); lucide.createIcons(); return; }
  document.querySelector('.modal-overlay').remove();
  MGAEMS.toast('Assignment created', 'success');
  loadAssignments();
}

async function deleteAssignment(id) {
  if (!confirm('Remove this assignment?')) return;
  const res = await MGAEMS.del(`/api/v1/teacher-assignments/${id}`);
  if (!res.ok) { MGAEMS.toast(res.error, 'error'); return; }
  MGAEMS.toast('Assignment removed', 'success');
  loadAssignments();
}

/* ================= Timetable ================= */

document.getElementById('timetableClassFilter').addEventListener('change', loadTimetableForClass);

async function loadTimetableForClass() {
  const classId = document.getElementById('timetableClassFilter').value;
  const el = document.getElementById('timetableCard');
  if (!classId) {
    el.innerHTML = MGAEMS.emptyStateHTML('Select a class', 'Choose a class above to view its timetable.', 'calendar');
    lucide.createIcons();
    return;
  }
  el.innerHTML = MGAEMS.loadingHTML();
  const res = await MGAEMS.get(`/api/v1/timetable/by-class?class_id=${classId}`);
  if (!res.ok) {
    if (res.status === 403) { el.innerHTML = MGAEMS.emptyStateHTML('Not available', 'Your role does not have access to this section.', 'lock'); lucide.createIcons(); return; }
    el.innerHTML = MGAEMS.errorHTML(res.error); lucide.createIcons(); return;
  }
  if (res.data.length === 0) {
    el.innerHTML = MGAEMS.emptyStateHTML('No timetable entries yet', 'Add the first entry for this class.', 'calendar');
    lucide.createIcons();
    return;
  }
  el.innerHTML = `
    <table>
      <thead><tr><th>Day</th><th>Time</th><th>Subject</th><th>Teacher</th><th></th></tr></thead>
      <tbody>${res.data.map(e => `
        <tr>
          <td>${DAY_NAMES[e.day_of_week]}</td>
          <td>${e.start_time.slice(0,5)} – ${e.end_time.slice(0,5)}</td>
          <td>${e.subject.name}</td>
          <td>${e.staff.first_name} ${e.staff.last_name}</td>
          <td>${canWriteStructure ? `<button class="btn btn-secondary btn-sm" onclick="deleteTimetableEntry(${e.id})"><i data-lucide="trash-2"></i></button>` : ''}</td>
        </tr>`).join('')}</tbody>
    </table>`;
  lucide.createIcons();
}

async function openTimetableModal() {
  const classId = document.getElementById('timetableClassFilter').value;
  if (!classId) { MGAEMS.toast('Select a class first', 'error'); return; }
  if (staffCache.length === 0) await loadStaffCache();
  const subjectOptions = subjectsCache.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  const staffOptions = staffCache.map(s => `<option value="${s.id}">${s.first_name} ${s.last_name}</option>`).join('');
  const dayOptions = DAY_NAMES.slice(1,6).map((d,i) => `<option value="${i+1}">${d}</option>`).join('');
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal-header"><h2>Add Timetable Entry</h2><button class="modal-close" onclick="this.closest('.modal-overlay').remove()"><i data-lucide="x"></i></button></div>
        <div class="modal-body">
          <div id="ttAlert"></div>
          <div class="form-grid">
            <div class="field"><label>Subject *</label><select id="tt_subject">${subjectOptions}</select></div>
            <div class="field"><label>Teacher *</label><select id="tt_staff">${staffOptions}</select></div>
            <div class="field"><label>Day *</label><select id="tt_day">${dayOptions}</select></div>
            <div class="field"></div>
            <div class="field"><label>Start Time *</label><input type="time" id="tt_start"></div>
            <div class="field"><label>End Time *</label><input type="time" id="tt_end"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
          <button class="btn btn-primary" onclick="submitTimetableEntry(${classId})">Save</button>
        </div>
      </div>
    </div>`);
  lucide.createIcons();
}

async function submitTimetableEntry(classId) {
  const alertBox = document.getElementById('ttAlert');
  const res = await MGAEMS.post('/api/v1/timetable', {
    class_id: classId,
    subject_id: document.getElementById('tt_subject').value,
    staff_id: document.getElementById('tt_staff').value,
    day_of_week: document.getElementById('tt_day').value,
    start_time: document.getElementById('tt_start').value,
    end_time: document.getElementById('tt_end').value,
  });
  if (!res.ok) { alertBox.innerHTML = MGAEMS.errorHTML(res.error); lucide.createIcons(); return; }
  document.querySelector('.modal-overlay').remove();
  MGAEMS.toast('Timetable entry added', 'success');
  loadTimetableForClass();
}

async function deleteTimetableEntry(id) {
  if (!confirm('Remove this timetable entry?')) return;
  const res = await MGAEMS.del(`/api/v1/timetable/${id}`);
  if (!res.ok) { MGAEMS.toast(res.error, 'error'); return; }
  MGAEMS.toast('Entry removed', 'success');
  loadTimetableForClass();
}

/* ================= Init ================= */

loadYears();
loadTerms();
loadClasses().then(() => { loadStreams(); loadSubjects(); loadAssignments(); });
</script>
</body>
