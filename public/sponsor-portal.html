<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sponsor Portal — MGAEMS</title><script src="/assets/app.js"></script>
<link rel="stylesheet" href="/assets/app.css"><script src="https://unpkg.com/lucide@latest"></script><style>.choices{display:flex;gap:.75rem;flex-wrap:wrap;margin:1rem 0}.choices button.active{background:var(--primary-bg);color:var(--on-primary)}.portal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem}.metric{font-size:1.5rem;font-weight:700}.portal-row{padding:.8rem;border:1px solid var(--gray-200);border-radius:8px;display:flex;justify-content:space-between;gap:1rem;margin:.6rem 0;align-items:center}section{margin-top:1.2rem}</style></head><body><script src="/assets/nav.js"></script><script>
const user=MGAEMS.requireAuth();if(user&&user.role!=='sponsor')location.href='/dashboard.html';renderAppShell('/sponsor-portal.html');const main=document.getElementById('appMain');let items,current,learner;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){main.innerHTML='<h2>Sponsor Portal</h2>'+MGAEMS.loadingHTML();const r=await MGAEMS.get('/api/v1/portal/sponsor/sponsorships');if(!r.ok)return fail(r);items=r.data;if(!items.length){main.innerHTML='<h2>Sponsor Portal</h2>'+MGAEMS.emptyStateHTML('No sponsorships linked','Contact the school if a sponsorship should appear here.','heart-handshake');return}current=items[0];shell();selectSponsor()}
function shell(){main.innerHTML=`<h2>Sponsor Portal</h2><p>Read-only programme and learner updates.</p><div class="choices">${items.map(x=>`<button class="btn btn-secondary sponsor" data-id="${x.id}">${esc(x.program_name||x.learner?.first_name+' '+x.learner?.last_name||'Sponsorship')} · ${esc(x.sponsorship_type.replace('_',' '))}</button>`).join('')}</div><div id="view"></div>`;document.querySelectorAll('.sponsor').forEach(b=>b.onclick=()=>{current=items.find(x=>x.id==b.dataset.id);selectSponsor()})}
async function selectSponsor(){document.querySelectorAll('.sponsor').forEach(b=>b.classList.toggle('active',b.dataset.id==current.id));const v=document.getElementById('view');v.innerHTML=MGAEMS.loadingHTML();if(current.sponsorship_type==='school_wide'){v.innerHTML=`<div class="card"><h3>${esc(current.program_name||'School-wide programme')}</h3><p><strong>School-wide</strong> · ${esc(current.status)}</p><p>This sponsorship is presented at programme level. Learner records are not available.</p></div>`;return}const r=await MGAEMS.get(`/api/v1/portal/sponsor/sponsorships/${current.id}/learners`);if(!r.ok)return fail(r,v);if(!r.data.length){v.innerHTML=MGAEMS.emptyStateHTML('No learners linked');return}learner=r.data[0];v.innerHTML=`<div class="card"><h3>${esc(current.program_name||'Learner sponsorship')}</h3><p>${esc(current.sponsorship_type)} · ${esc(current.status)}</p>${current.sponsorship_type==='group'?`<label>Group learner</label><select id="member">${r.data.map(x=>`<option value="${x.id}">${esc(x.first_name)} ${esc(x.last_name)}</option>`).join('')}</select>`:''}</div><div id="detail"></div>`;if(document.getElementById('member'))document.getElementById('member').onchange=e=>{learner=r.data.find(x=>x.id==e.target.value);loadLearner()};loadLearner()}
async function loadLearner(){const d=document.getElementById('detail');d.innerHTML=MGAEMS.loadingHTML('Loading protected learner records…');const root=`/api/v1/portal/sponsor/sponsorships/${current.id}`;const base=current.sponsorship_type==='group'?`${root}/learners/${learner.id}`:root;const [a,c,m]=await Promise.all([MGAEMS.get(base+'/attendance'),MGAEMS.get(base+'/report-cards'),MGAEMS.get(base+'/comments')]);if(!a.ok||!c.ok||!m.ok)return fail(!a.ok?a:!c.ok?c:m,d);const s=a.data.summary;d.innerHTML=`<section><h3>${esc(learner.first_name)} ${esc(learner.last_name)}</h3><p>${esc(learner.admission_no)} · ${esc(learner.class?.name||'Class not assigned')}</p><h3>Attendance</h3>${s.total?`<div class="portal-grid">${[['Present',s.present],['Absent',s.absent],['Late',s.late],['Excused',s.excused],['Attendance',s.attendance_percentage+'%']].map(x=>`<div class="card"><div class="metric">${x[1]}</div>${x[0]}</div>`).join('')}</div>`:MGAEMS.emptyStateHTML('No attendance records')}</section><section><h3>Assessment remarks</h3>${m.data.length?m.data.map(x=>`<div class="portal-row"><div><strong>${esc(x.subject)}</strong> · ${esc(x.term)}<br>${esc(x.remarks)}</div><span>${esc(x.competency_rating||x.score||'')}</span></div>`).join(''):MGAEMS.emptyStateHTML('No assessment remarks')}</section><section><h3>Report cards</h3>${c.data.length?c.data.map(x=>`<div class="portal-row"><div><strong>${esc(x.term?.name||'Report card')}</strong><br>${esc(x.overall_remark||'')}</div>${x.download_available?`<button class="btn btn-primary" onclick="card(${x.id},this)">Download</button>`:''}</div>`).join(''):MGAEMS.emptyStateHTML('No report cards')}</section>`}
async function card(id,b){b.disabled=true;b.textContent='Downloading…';const root=`/api/v1/portal/sponsor/sponsorships/${current.id}`;const base=current.sponsorship_type==='group'?`${root}/learners/${learner.id}`:root;const r=await MGAEMS.download(`${base}/report-cards/${id}/download`,`report-card-${learner.admission_no}.pdf`);b.disabled=false;b.textContent='Download';if(!r.ok)MGAEMS.toast(r.status===403?'This report card is outside your sponsorship.':r.error,'error')}
function fail(r,t=main){t.innerHTML=MGAEMS.errorHTML(r.status===403?'You do not have permission to view this sponsorship.':r.error);MGAEMS.initIcons()}MGAEMS.initSidebar();MGAEMS.initIcons();init();
</script></body></html>
