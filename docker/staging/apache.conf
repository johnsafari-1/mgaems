Listen ${PORT}
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
        <FilesMatch "^(?!index\.php$).*\.php$">
            Require all denied
        </FilesMatch>
    </Directory>
    <Directory /var/www/html/storage/app/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        <FilesMatch "\.(php[0-9]?|phtml|phar|html?|svg)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    # %U deliberately excludes queries, reset tokens and email addresses.
    LogFormat "%h %m %U %>s %b %D" mgaems_safe
    CustomLog /proc/self/fd/1 mgaems_safe
    ErrorLog /proc/self/fd/2
</VirtualHost>
